<!DOCTYPE html>
<html lang="en" data-sky="day" data-mode="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Throwbacks — your AI throwbacks</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%231d64d8'/%3E%3Cstop offset='1' stop-color='%2336c6d9'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='10' fill='url(%23g)'/%3E%3Cpath d='M15 22 7 16l8-6zM25 22l-8-6 8-6z' fill='%23fff'/%3E%3C/svg%3E">
  <!-- Fonts: Onest (interface), Instrument Serif (wordmark, day titles,
       numbers), Geist Mono (code), Newsreader (serif replies, if chosen).
       Browsers download only the families in use; offline, system fonts. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400..700&family=Instrument+Serif:ital@0;1&family=Geist+Mono:wght@400..600&family=Newsreader:opsz,wght@6..72,400..600&display=swap">
  <link rel="stylesheet" href="glass.css">
  <script>
    // Apply the saved appearance before first paint (js/theme.js owns the rest).
    try {
      const a = JSON.parse(localStorage.getItem('throwbacks-appearance')) || {};
      const d = document.documentElement.dataset;
      const v = Number(a.v) || 0;
      // The sky: Day unless another is saved; "live" follows the clock (the
      // same hours as skyForHour in theme.js). Saves older than v2 stored
      // "live" only because it was the default then: read it as unset.
      const h = new Date().getHours();
      const live = h >= 5 && h < 10 ? 'dawn' : h >= 10 && h < 17 ? 'day' : h >= 17 && h < 20 ? 'dusk' : 'night';
      const sky = v >= 2 || a.sky !== 'live' ? a.sky : undefined;
      d.sky = /^(dawn|day|dusk|night|mono)$/.test(sky) ? sky : sky === 'live' ? live : 'day';
      if (a.glass === 'tinted') d.glass = 'tinted';
      if (a.gfont === 'system') d.gfont = 'system';
      // One mode since v3 (light by default); older saves kept Liquid Glass's in gmode.
      const mode = v >= 3 ? a.mode : a.gmode;
      if (mode === 'dark') d.mode = 'dark';
      else if (mode === 'system') delete d.mode;
      if (a.text === 'large' || a.text === 'larger') d.text = a.text;
      if (a.reply === 'serif') d.reply = 'serif';
    } catch (e) {
      // storage blocked: the defaults (Day, light) from the <html> tag
    }
  </script>
</head>
<body>

  <!-- The sky the glass floats on (decorative). -->
  <div class="lg-sky" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

  <!-- Exactly ONE phase is mounted here at any time (import | viewer). -->
  <div id="root"></div>

  <!-- Invisible shared infrastructure, used by both phases. -->
  <input type="file" id="file-input" accept=".json,.zip,.jsonl" multiple hidden>
  <input type="file" id="dir-fallback-input" webkitdirectory hidden>

  <!-- <i data-icon="…"> placeholders become inline SVG icons (js/icons.js). -->

  <!-- ================= Phase A: the front page ================= -->
  <template id="tpl-import">
    <section id="landing">
      <div class="landing-card">
        <div class="brand-lockup">
          <div class="brand-tile"><i data-icon="rewind" data-size="24"></i></div>
          <h1 class="brand">Throwbacks</h1>
          <p class="tagline">your AI throwbacks — what were you working on?</p>
        </div>

        <section class="apps-panel" aria-labelledby="apps-title">
          <div class="apps-head">
            <div class="apps-heading">
              <h2 id="apps-title" class="apps-title">Your AI apps</h2>
              <p class="apps-sub">Open any app’s conversations — read straight from this Mac, never changed.</p>
            </div>
            <button id="load-all-btn" class="btn btn-primary" hidden><i data-icon="layers"></i><span class="btn-label">Load all apps</span></button>
          </div>
          <div id="source-grid" class="source-grid"></div>
          <div id="import-busy" class="busy" hidden></div>
          <div id="landing-error" class="landing-error" hidden></div>
        </section>

        <div class="dropzone" id="dropzone">
          <p class="drop-title">Or drop files anywhere</p>
          <p class="drop-sub">A claude.ai export (.zip or conversations.json), Claude Code .jsonl, or Copilot session files</p>
          <div class="landing-actions">
            <button id="choose-file-btn" class="btn"><i data-icon="upload"></i>Choose file</button>
            <button id="choose-folder-btn" class="btn"><i data-icon="folder"></i>Choose folder</button>
            <button id="sample-btn" class="btn btn-ghost"><i data-icon="flask"></i>Try sample data</button>
          </div>
        </div>

        <details class="export-help">
          <summary>How to export your claude.ai chats</summary>
          <ol class="steps">
            <li>On claude.ai open <strong>Settings → Privacy → Export data</strong></li>
            <li>Wait for the email and download the .zip</li>
            <li>Drop the .zip (or conversations.json from inside it) on this page</li>
          </ol>
        </details>

        <p class="privacy"><i data-icon="lock" data-size="14"></i><span>No uploads, no analytics: your chats leave this machine only as the text you send to an AI summarizer you set up. Loaded chats live only in this tab; close it and they’re gone. Only the summaries you make, the chats you choose to keep a copy of and what you pin or archive are saved — on this Mac.</span></p>
      </div>
    </section>
  </template>

  <!-- ================= Phase B: the journal ================= -->
  <!-- A rail (Today · Sessions · Insights · Search · Settings), the main
       pane (a top bar with the week strip and the plan bar, then the page)
       and the conversation beside it. Phones: tabs along the bottom. -->
  <template id="tpl-viewer">
    <div id="app" class="shell">
      <nav id="rail" class="rail pane" aria-label="Throwbacks"></nav>
      <main class="main pane">
        <header id="topbar" class="topbar"></header>
        <div id="page-scroll" class="page-scroll"></div>
      </main>
      <aside id="reader" class="reader pane" aria-label="Conversation" hidden></aside>
      <nav id="tabbar" class="tabbar" aria-label="Throwbacks"></nav>
      <div id="busy-pill" class="busy-pill" role="status" hidden><span class="spinner"></span><span></span></div>
      <div id="job-pill" class="busy-pill job-pill" hidden><span class="spinner"></span><span class="job-note" role="status"></span><button type="button" id="job-stop" class="btn btn-small btn-ghost">Stop</button></div>
    </div>
  </template>

  <script type="module" src="js/main.js"></script>
</body>
</html>
